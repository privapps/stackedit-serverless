name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify static app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run unit
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser smoke
        run: npm run browser-smoke
      - name: Upload verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackedit-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified static artifact
        uses: actions/download-artifact@v4
        with:
          name: stackedit-static-site
          path: dist
      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          mkdir output
          cp -r static output
          mkdir output/docs
          cp -r dist output/docs/app
          cd output/docs
          mv ../static/sitemap.xml .
          mv ../static .
          mv static/landing/index.html .
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Publish verified artifact to GitHub Pages
        shell: bash
        run: |
          cd gh-pages
          git rm -r --ignore-unmatch -- .
          cp -r ../output/. .
          git add -A
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "bot"
          if git diff --cached --quiet; then
            echo "No GitHub Pages changes to deploy."
            exit 0
          fi
          git commit -m "sync with code $(date +'%F')"
          git push origin HEAD:gh-pages
